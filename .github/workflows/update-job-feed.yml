name: Update public Brazil jobs feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-jobs-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
      - name: Collect and normalize authorized listings
        shell: pwsh
        run: ./scripts/update-job-feed.ps1
      - name: Publish the updated feed or preserved-feed error status
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs-feed.json
          if git diff --cached --quiet; then
            echo "There is no feed update to publish."
          else
            git commit -m "Update published Brazil jobs feed and status"
            git push
          fi
